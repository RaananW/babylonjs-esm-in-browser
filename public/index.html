<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A live Babylon.js example that loads tree-shakeable ES modules directly in the browser with an import map and no bundler."
    />
    <meta name="theme-color" content="#111827" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babylon.js Native ES Modules" />
    <meta property="og:title" content="Babylon.js Native ES Modules in the Browser" />
    <meta
      property="og:description"
      content="See Babylon.js load as native, tree-shakeable ES modules using an import map and no bundler."
    />
    <meta
      property="og:url"
      content="https://raananw.github.io/babylonjs-esm-in-browser/"
    />
    <meta name="twitter:card" content="summary" />
    <link
      rel="canonical"
      href="https://raananw.github.io/babylonjs-esm-in-browser/"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://assets.babylonjs.com" crossorigin />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      .site-info {
        position: fixed;
        z-index: 1;
        top: max(1rem, env(safe-area-inset-top));
        left: max(1rem, env(safe-area-inset-left));
        box-sizing: border-box;
        width: min(30rem, calc(100vw - 2rem));
        padding: 1rem 1.125rem;
        color: #f8fafc;
        background: rgb(17 24 39 / 88%);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.75rem;
        box-shadow: 0 0.75rem 2rem rgb(0 0 0 / 25%);
        backdrop-filter: blur(0.5rem);
      }

      .site-info h1 {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.4;
      }

      .site-info p {
        margin: 0.5rem 0 0;
        color: #dbeafe;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .site-info a {
        color: #7dd3fc;
        font-weight: 600;
        text-underline-offset: 0.2em;
      }

      .site-info a:hover {
        color: #bae6fd;
      }

      .site-info a:focus-visible {
        outline: 2px solid #f8fafc;
        outline-offset: 0.2rem;
      }
    </style>
    <title>Babylon.js Native ES Modules in the Browser</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Babylon.js Native ES Modules in the Browser",
        "description": "A live example that loads tree-shakeable Babylon.js ES modules directly in the browser with an import map and no bundler.",
        "codeRepository": "https://github.com/RaananW/babylonjs-esm-in-browser",
        "license": "https://opensource.org/license/mit",
        "programmingLanguage": ["TypeScript", "JavaScript"],
        "runtimePlatform": "Web browser",
        "url": "https://raananw.github.io/babylonjs-esm-in-browser/"
      }
    </script>
  </head>
  <body>
    <main class="site-info">
      <h1 id="page-title">Babylon.js Native ES Modules in the Browser</h1>
      <p id="page-description">
        This interactive example loads Babylon.js as native browser ES modules
        through an import map. It uses granular pure imports and requires no
        application bundler.
      </p>
      <p>
        <a
          href="https://github.com/RaananW/babylonjs-esm-in-browser"
          target="_blank"
          rel="noopener noreferrer"
        >
          View source code on GitHub
        </a>
      </p>
    </main>
    <canvas
      id="renderCanvas"
      aria-labelledby="page-title"
      aria-describedby="page-description"
      tabindex="0"
    ></canvas>
    <noscript>This interactive Babylon.js example requires JavaScript.</noscript>
    <script type="importmap">
      {
        "imports": {
          "@babylonjs/core": "./@babylonjs/core/index.js",
          "@babylonjs/core/": "./@babylonjs/core/",
          "@babylonjs/loaders": "./@babylonjs/loaders/index.js",
          "@babylonjs/loaders/": "./@babylonjs/loaders/"
        }
      }
    </script>
    <script type="module" src="index.js"></script>
  </body>
