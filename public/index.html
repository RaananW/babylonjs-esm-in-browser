<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
    </style>
    <title>Babylon.js ES Modules</title>
  </head>
  <body>
    <canvas id="renderCanvas" aria-label="Interactive Babylon.js scene" tabindex="0"></canvas>
    <script type="importmap">
      {
        "imports": {
          "@babylonjs/core": "./@babylonjs/core/index.js",
          "@babylonjs/core/": "./@babylonjs/core/",
          "@babylonjs/loaders": "./@babylonjs/loaders/index.js",
          "@babylonjs/loaders/": "./@babylonjs/loaders/"
        }
      }
    </script>
    <script type="module" src="index.js"></script>
  </body>
</html>
